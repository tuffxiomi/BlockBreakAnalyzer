name: Build BlockBreakAnalyzer

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  NDK_VERSION: "28.2.13676358"
  ANDROID_PLATFORM: "android-28"

jobs:
  build:
    name: Build ARM64 LeviPack
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;${NDK_VERSION}"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build unzip

      - name: Configure Android environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=${ANDROID_HOME}"

          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

          test -d "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          test -f "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake"

      - name: Show tool versions
        run: |
          cmake --version
          ninja --version
          python3 --version
          "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" --version

      - name: Verify project
        shell: bash
        run: |
          set -euxo pipefail

          test -f CMakeLists.txt
          test -f src/Api.cpp
          test -f include/Analyzer.hpp
          test -f include/Offsets.hpp
          test -f include/Signatures.hpp
          test -f resources/minecraft.ttf
          test -f assets/icon.png
          test -f scripts/package_levipack.py

      - name: Configure CMake
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build-android

          cmake \
            -S . \
            -B build-android \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="${ANDROID_PLATFORM}" \
            -DANDROID_STL=c++_shared \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON

      - name: Build native library
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build build-android \
            --config Release \
            --parallel 2

      - name: Verify ARM64 library
        shell: bash
        run: |
          set -euxo pipefail

          LIB="build-android/libBlockBreakAnalyzer.so"

          test -f "$LIB"

          file "$LIB"

          readelf -h "$LIB" | grep "Class:"
          readelf -h "$LIB" | grep "Machine:"

          readelf -d "$LIB" || true

      - name: Package LeviPack
        shell: bash
        run: |
          set -euxo pipefail

          python3 scripts/package_levipack.py \
            --library build-android/libBlockBreakAnalyzer.so \
            --icon assets/icon.png \
            --font resources/minecraft.ttf \
            --output BlockBreakAnalyzer.levipack

          test -f BlockBreakAnalyzer.levipack

      - name: Validate LeviPack
        shell: bash
        run: |
          set -euxo pipefail

          unzip -t BlockBreakAnalyzer.levipack

          python3 - <<'PY'
          import json
          import zipfile

          package = "BlockBreakAnalyzer.levipack"

          expected = {
              "manifest.json",
              "libBlockBreakAnalyzer.so",
              "icon.png",
              "resources/minecraft.ttf",
          }

          with zipfile.ZipFile(package, "r") as z:
              actual = set(z.namelist())

              if actual != expected:
                  raise SystemExit(
                      "Invalid package contents:\n"
                      f"Expected: {sorted(expected)}\n"
                      f"Actual:   {sorted(actual)}"
                  )

              manifest = json.loads(z.read("manifest.json"))

              if manifest.get("type") != "preload-native":
                  raise SystemExit("Invalid manifest type")

              if manifest.get("entry") != "libBlockBreakAnalyzer.so":
                  raise SystemExit("Invalid native entry")

              for filename in expected:
                  if z.getinfo(filename).file_size == 0:
                      raise SystemExit(f"Empty package entry: {filename}")

          print("LeviPack validation passed.")
          PY

      - name: Generate checksums
        shell: bash
        run: |
          sha256sum \
            BlockBreakAnalyzer.levipack \
            build-android/libBlockBreakAnalyzer.so \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Upload LeviPack
        uses: actions/upload-artifact@v6
        with:
          name: BlockBreakAnalyzer-arm64-v8a
          path: |
            BlockBreakAnalyzer.levipack
            SHA256SUMS.txt

      - name: Upload native library
        uses: actions/upload-artifact@v6
        with:
          name: BlockBreakAnalyzer-native-arm64-v8a
          path: build-android/libBlockBreakAnalyzer.so
