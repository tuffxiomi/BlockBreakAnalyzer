name: Build BlockBreakAnalyzer

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: blockbreakanalyzer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API: "28"
  ANDROID_NDK_VERSION: "28.2.13676358"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${ANDROID_NDK_VERSION}"

          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure Android environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

          test -f \
            "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}/build/cmake/android.toolchain.cmake"

      - name: Configure CMake
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build-android

          cmake \
            -S . \
            -B build-android \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${ANDROID_API} \
            -DANDROID_STL=c++_shared

      - name: Build and link native library
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build build-android \
            --target BlockBreakAnalyzer \
            --parallel 2

      - name: Verify native ELF
        shell: bash
        run: |
          set -euxo pipefail

          LIB="build-android/libBlockBreakAnalyzer.so"

          test -f "$LIB"

          file "$LIB"

          readelf -h "$LIB" | grep 'Class:.*ELF64'
          readelf -h "$LIB" | grep 'Machine:.*AArch64'

          if readelf -Ws "$LIB" | \
            grep -E 'UND.*pl::memory::(hook|unhook|resolveSignature)'; then

            echo "ERROR: unresolved Preloader SDK symbols remain"
            exit 1
          fi

          nm -D "$LIB" | grep 'PLGetModRegistration'

      - name: Package LeviPack
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build build-android \
            --target levi_package \
            --parallel 2

          test -f \
            build-android/BlockBreakAnalyzer-arm64-v8a.levipack

          unzip -t \
            build-android/BlockBreakAnalyzer-arm64-v8a.levipack

      - name: Verify package contents
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          import json
          import zipfile

          path = "build-android/BlockBreakAnalyzer-arm64-v8a.levipack"

          expected = {
              "blockbreakanalyzer/manifest.json",
              "blockbreakanalyzer/libBlockBreakAnalyzer.so",
              "blockbreakanalyzer/icon.png",
              "blockbreakanalyzer/resources/minecraft.ttf",
          }

          with zipfile.ZipFile(path) as z:
              actual = set(z.namelist())

              assert actual == expected, (
                  sorted(actual),
                  sorted(expected)
              )

              manifest = json.loads(
                  z.read("blockbreakanalyzer/manifest.json")
              )

              assert manifest["type"] == "preload-native"
              assert manifest["entry"] == "libBlockBreakAnalyzer.so"
              assert manifest["icon"] == "icon.png"

          print("LeviPack validation passed.")
          PY

      - name: Generate SHA256
        run: |
          sha256sum \
            build-android/BlockBreakAnalyzer-arm64-v8a.levipack \
            build-android/libBlockBreakAnalyzer.so \
            > SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: BlockBreakAnalyzer-arm64-v8a
          path: |
            build-android/BlockBreakAnalyzer-arm64-v8a.levipack
            build-android/libBlockBreakAnalyzer.so
            SHA256SUMS.txt
